spring:
  application:
    name: helpdesk
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/helpdesk}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-key-before-production-123456}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

